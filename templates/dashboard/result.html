{% extends "base/base.html" %}

{% block head %}
    <style>
        .model-result {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .model-result h2 {
            margin: 0 0 20px;
            text-align: center;
        }

        .model-result pre {
            width: 100%;
            max-height: 600px;
            box-sizing: border-box;
            margin: 0;
            padding: 25px;
            overflow: auto;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            background: #f7f9fc;
            border: 1px solid #dce3ec;
            border-radius: 15px;
            line-height: 1.7;
            font-family: monospace;
        }

        .ask-ai-box {
            width: 90%;
            max-width: 850px;
            margin: 60px auto 40px;
            text-align: center;
        }

        .ask-ai-box h2 {
            margin-bottom: 25px;
        }

        .chatbox {
            width: 100%;
            height: 700px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background: white;
            border: 1px solid #dce3ec;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .messages {
            flex: 1;
            min-height: 0;
            margin: 0 0;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .flex {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
        }

        #msg {
            width: 350px;
            min-height: 50px;
            max-height: 150px;
            box-sizing: border-box;
            resize: vertical;
            padding: 10px;
            border: 2px solid var(--base-bg);
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            background: white;
            color: #222;
        }

        #msg:focus {
            outline: none;
            border-color: var(--base-bg);
        }

        #send-message {
            height: 52px;
            padding: 0 22px;
            border: 2px solid var(--base-bg);
            border-radius: 10px;
            background: var(--base-bg);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            transition: 0.2s;
        }

        #send-message:hover {
            background: transparent;
            color: var(--base-bg);
        }

        #send-message:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .ai-response {
            align-self: flex-end;
            max-width: 70%;
            padding: 12px 15px 12px 15px;
            padding-top: 0;
            margin: 0;
            background: #f8f8f8;
            border: 1px solid #e9e9e9;
            border-radius: 10px;
            align-self: flex-end;
            max-width: 40%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-response pre {
            width: auto;
            max-width: 100%;
            margin: 0;
            padding: 0;
            margin-bottom: 30px;
            background: transparent;
            border: none;
            white-space: pre-wrap;
            word-break: break-word;
            text-align: right;
            direction: rtl;
        }

        .user-q {
            align-self: flex-start;
            max-width: 70%;
            padding: 12px 15px 12px 15px;
            padding-top: 0;
            margin: 0;
            background: #f8f8f8;
            border: 1px solid var(--base-bg);
            border-radius: 10px;
            align-self: flex-start;
            max-width: 40%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-q pre {
            width: auto;
            max-width: 100%;
            margin: 0;
            padding: 0;
            padding: 10px;
            margin-top: 10px;
            background: transparent;
            border: none;
            white-space: pre-wrap;
            word-break: break-word;
            text-align: right;
            direction: rtl;
        }

        footer { position: absolute; margin-top: 0px; }

        @media (max-width: 600px) {
            .model-result,
            .ask-ai-box {
                width: 94%;
            }

            .model-result pre {
                padding: 15px;
                font-size: 13px;
            }

            .chatbox {
                height: 650px;
                padding: 15px;
            }

            .flex {
                align-items: stretch;
                flex-direction: column;
            }

            #msg {
                width: 100%;
            }

            #send-message {
                width: 100%;
            }

            .ai-response {
                max-width: 90%;
            }
        }
    </style>
{% endblock %}

{% block body %}
    <div class="model-result">
        <h2 class="title">نتایج بررسی :</h2>

        <pre dir="ltr" id="result">{{ result }}</pre>
    </div>

    <div class="ask-ai-box">
        <h2>برای پیشبینی ریزش از هوش مصنوعی بپرس!</h2>

        <div class="chatbox">
            <div class="messages"></div>

            <div class="flex" id="bottom">
                <textarea
                    id="msg"
                    placeholder="پیام خود را بنویسید ..."
                ></textarea>

                <button id="send-message">ارسال</button>
            </div>
        </div>
    </div>

    <script src="/static/js/ai.js"></script>
{% endblock %}
